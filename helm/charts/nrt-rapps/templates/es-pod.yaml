apiVersion: v1
kind: Pod
metadata:
  name: es-rapp
  namespace: nonrtric
  labels:
    app: es-rapp
spec:
  containers:
  - name: es-rapp
    image: localhost:5000/es-rapp:latest
    imagePullPolicy: Always
    env:
    - name: LOAD_PREDICTOR
      value: "load-predictor"
    - name: LOAD_PREDICTOR_PORT
      value: "9098"
    - name: LOAD_PREDICTOR_API
      value: "predict"
    - name: SDN_CONTROLLER_ADDRESS
      value: "172.21.0.1"
    - name: SDN_CONTROLLER_PORT
      value: "8888"
    - name: SDN_CONTROLLER_USERNAME
      value: root"
    - name: SDN_CONTROLLER_PASSWORD
      value: "viavi"
#    - name: CREDS_CLIENT_SECRET
#      value: {{ .Values.esrapp.clientsecret }}
#    - name: CREDS_CLIENT_ID
#      value: es-rapp
#    - name: AUTH_SERVICE_URL
#      value: http://keycloak.nonrtric/realms/nonrtric-realm/protocol/openid-connect/token
    - name: TOPIC
      value: forward-rapp-topic
    - name: KAFKA_SERVER
      value: kafka-1-kafka-bootstrap.nonrtric:9092
    - name: APPID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
  - name: load-predictor
    image: localhost:5000/load-predictor:latest
    imagePullPolicy: Always
