apiVersion: v1
kind: Pod
metadata:
  name: ts-rapp
  namespace: nonrtric
  labels:
    app: ts-rapp
spec:
  containers:
  - name: ts-rapp
    image: localhost:5000/ts-rapp:latest
    command: ["sleep", "infinity"]
    imagePullPolicy: IfNotPresent
    ports:
    - name: http
      containerPort: 80
    env:
    - name: USE_O1_SIMULATOR
      value: "true"
    - name: VIAVI_ADDRESS
      value: "172.21.0.1"
    - name: VIAVI_PORT
      value: "8888"
    - name: VIAVI_USER
      value: "root"
    - name: VIAVI_PASS
      value: "viavi"
    - name: KAFKA_SERVER
      value: kafka-1-kafka-bootstrap.nonrtric
    - name: CONSUMER_PORT
      value: "9097"
    - name: PRODUCER_PORT
      value: "9092"
    - name: ICS
      value: informationservice.nonrtric:8083
    - name: INPUT_TOPIC
      value: forward-rapp-topic
    - name: O1_TOPIC
      value: o1-topic
    - name: CREDS_GRANT_TYPE
      value: client_credentials
    - name: CREDS_CLIENT_SECRET
      value: {{ .Values.tsrapp.clientsecret }}
    - name: CREDS_CLIENT_ID
      value: ts-rapp
    - name: AUTH_SERVICE_URL
      value: http://keycloak.nonrtric/realms/nonrtric-realm/protocol/openid-connect/token

