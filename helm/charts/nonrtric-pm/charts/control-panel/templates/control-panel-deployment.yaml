apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-panel
  namespace: nonrtric
  labels:
    app: control-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-panel
  template:
    metadata:
      labels:
        app: control-panel
    spec:
      containers:
      - name: control-panel
        image: nexus3.o-ran-sc.org:10001/o-ran-sc/nonrtric-controlpanel:2.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          name: control-panel-cm-config
      volumes:
      - configMap:
          defaultMode: 420
          name: control-panel-cm-config
        name: control-panel-cm-config