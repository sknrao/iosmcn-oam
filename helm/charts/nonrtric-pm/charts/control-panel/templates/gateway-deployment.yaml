apiVersion: apps/v1
kind: Deployment
metadata:
  name: nonrtricgateway
  namespace: nonrtric
  labels:
    app: nonrtricgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nonrtricgateway
  template:
    metadata:
      labels:
        app: nonrtricgateway
    spec:
      containers:
      - name: gateway
        image: nexus3.o-ran-sc.org:10001/o-ran-sc/nonrtric-gateway:1.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
        volumeMounts:
        - mountPath: /opt/app/nonrtric-gateway/config/application.yaml
          subPath: application.yaml
          name: gateway-cm-config
      volumes:
      - configMap:
          defaultMode: 420
          name: gateway-cm-config
        name: gateway-cm-config